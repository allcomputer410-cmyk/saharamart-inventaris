name: inventaris-vps

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventaris
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Jalankan deploy/setup.sh dulu}
    volumes:
      - inventaris_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventaris"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Tidak diekspos ke host/internet — hanya diakses dari service lain.

  rest:
    image: postgrest/postgrest:v13.0.6
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${REST_DB_PASSWORD}@db:5432/inventaris
      PGRST_DB_SCHEMAS: public
      PGRST_JWT_SECRET: ${POSTGREST_JWT_SECRET}
      PGRST_DB_MAX_ROWS: 10000
      PGRST_DB_POOL: 5
    # Tidak diekspos ke host/internet.

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/inventaris
      POSTGREST_URL: http://rest:3000
      POSTGREST_JWT_SECRET: ${POSTGREST_JWT_SECRET}
      APP_ORIGIN: ${APP_ORIGIN:?Isi domain HTTPS di .env, mis. https://inventaris.deliveryku.com}
      CRON_SECRET: ${CRON_SECRET:-}
      NODE_ENV: production
    ports:
      # Hanya di-bind ke localhost VPS; Caddy yang mem-proxy ke publik dengan HTTPS.
      - "127.0.0.1:${APP_PORT:-3100}:3000"

volumes:
  inventaris_data:
